name: Publish image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR verlangt einen kleingeschriebenen Image-Namen.
      # Branch-Namen koennen "/" enthalten - ungueltig als Docker-Tag.
      # "latest" nur fuer main/Tags, damit Test-Builds es nicht ueberschreiben.
      - name: Image tags
        id: image
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${GITHUB_REF_NAME//\//-}"
          tags="${name}:${tag}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] || [ "${GITHUB_REF_NAME}" = "main" ]; then
            tags="${tags},${name}:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}

      # Der Fehler war zur Laufzeit: die CLI fand "effect" nicht. Der Build
      # allein beweist das nicht, deshalb die CLI im Image wirklich starten.
      - name: Smoke-test prisma CLI
        env:
          TAGS: ${{ steps.image.outputs.tags }}
        run: |
          img="${TAGS%%,*}"
          docker pull "$img"
          docker run --rm "$img" node node_modules/prisma/build/index.js --version
