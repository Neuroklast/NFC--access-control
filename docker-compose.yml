services:
  db:
    image: postgres:16-alpine
    # Kein Host-Port: die App erreicht die DB nur intern über den Service-Namen "db".
    environment:
      POSTGRES_USER: nfc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
      POSTGRES_DB: nfc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nfc -d nfc"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Fertiges Image von GitHub; auf der NAS: docker compose pull && docker compose up -d
    # statt lokal zu bauen. Mit --build wird weiterhin aus dem Quellcode gebaut.
    image: ghcr.io/neuroklast/nfc--access-control:latest
    build: .
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://nfc:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}@db:5432/nfc
      DIRECT_URL: postgresql://nfc:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}@db:5432/nfc
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET in .env setzen}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@club.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD in .env setzen}
      SEED_DEMO: ${SEED_DEMO:-0}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
