services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nfc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
      POSTGRES_DB: nfc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nfc -d nfc"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Bind-Adresse/Port über .env konfigurierbar (install.sh fragt danach).
      # Default: nur lokal - die App erreicht die DB über das Docker-Netz.
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-5432}:5432"

  app:
    build: .
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://nfc:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}@db:5432/nfc
      DIRECT_URL: postgresql://nfc:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}@db:5432/nfc
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET in .env setzen}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@club.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD in .env setzen}
      SEED_DEMO: ${SEED_DEMO:-0}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
