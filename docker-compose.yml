services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nfc
      POSTGRES_PASSWORD: nfc
      POSTGRES_DB: nfc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nfc -d nfc"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://nfc:nfc@db:5432/nfc
      SESSION_SECRET: replace-with-at-least-16-chars
      ADMIN_EMAIL: admin@club.local
      ADMIN_PASSWORD: changeme
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
